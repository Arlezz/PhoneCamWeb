<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>PhoneCam Web</title>
  <style>
    /* Paleta de la identidad D, la misma de la app. */
    :root {
      color-scheme: light dark;
      --bg: #f6f7f8; --text: #16181b; --muted: #4a5058; --line: #d3d7dc;
      --primary: #2350d8; --on-primary: #fff;
      --tally: #e5383b; --warn: #d98e04; --off: #8a9099; --err: #ba1a1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202327; --text: #e6e8eb; --muted: #aeb4bb; --line: #464b53;
        --primary: #b3c5ff; --on-primary: #0a2463;
        --tally: #ff5f61; --warn: #f2b33d; --err: #ffb4ab;
      }
    }
    body { width: 300px; margin: 0; padding: 14px 16px 16px; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; box-sizing: border-box; }
    .dot.conectado { background: var(--tally); }
    .dot.conectando, .dot.reconectando { background: var(--warn); }
    /* Anillo hueco: el error no se distingue de "Transmitiendo" solo por el color. */
    .dot.error { background: transparent; border: 2px solid var(--err); }
    .detail { color: var(--muted); margin: 0 0 12px; min-height: 1.4em; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    .row { display: flex; gap: 6px; }
    input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font: 12px ui-monospace, monospace; background: transparent; color: inherit; }
    button { padding: 6px 10px; border: 0; border-radius: 8px; background: var(--primary); color: var(--on-primary); font-weight: 600; cursor: pointer; }
    .saved { color: var(--primary); font-size: 12px; min-height: 1.4em; margin: 4px 0 8px; }
    .help { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
  </style>
</head>
<body>
  <h1>PhoneCam Web</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="status">Sin uso en esta pestaña</span></div>
  <p id="detail" class="detail"></p>

  <label for="address">Dirección del teléfono</label>
  <div class="row">
    <input id="address" spellcheck="false">
    <button id="save">Guardar</button>
  </div>
  <div id="saved" class="saved"></div>

  <p class="help">En la videollamada, elige <b>Cámara Android (PhoneCam Web)</b> en la configuración de video.</p>
  <p class="help"><b>Cable:</b> <code>ws://127.0.0.1:5000</code> con <code>tools/usb-forward.sh</code> corriendo.<br>
    <b>Wi‑Fi:</b> activa la opción en la app y pega aquí la dirección que muestra (incluye el código).</p>

  <script src="popup.js"></script>
</body>
</html>
